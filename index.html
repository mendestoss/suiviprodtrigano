<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trigano – Suivi de lancements</title>
<link rel="icon" href="logo.png">
<style>
:root{--red:#dc0028;--red2:#b30020;--ink:#1d1f24;--mut:#6b7078;--line:#dfe2e7;--bg:#eef0f3;--card:#fff;--ok:#2e7d32;--okb:#e3f3e4;--ko:#c62828;--kob:#fde7e7;--or:#c77700;--orb:#fff1d9;--bl:#1e4a9c;--blb:#e4ecfb}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
button,select,input{font:inherit;color:inherit}
header.top{background:var(--red);color:#fff;display:flex;align-items:center;gap:14px;padding:10px 16px;position:sticky;top:0;z-index:5}
header.top img{height:38px;display:block}
header.top .who{margin-left:auto;text-align:right;font-size:13px;line-height:1.3}
header.top .who b{display:block;font-size:14px}
.link{background:none;border:0;color:#fff;text-decoration:underline;cursor:pointer;padding:0;font-size:13px}
main{max-width:1100px;margin:0 auto;padding:16px}
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tab{flex:1;padding:14px;border:2px solid var(--line);background:var(--card);border-radius:8px;font-weight:800;font-size:18px;cursor:pointer}
.tab.on{border-color:var(--red);background:var(--red);color:#fff}
.panel{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:14px}
.panel h2{margin:0 0 12px;font-size:17px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end}
label.f{display:grid;gap:4px;font-size:13px;color:var(--mut);font-weight:600}
input,select{border:1px solid #c7cbd2;border-radius:6px;padding:9px 10px;background:#fff;width:100%;min-width:0}
input:focus-visible,select:focus-visible,button:focus-visible{outline:3px solid #ffb3c0;outline-offset:1px}
.btn{border:0;background:var(--red);color:#fff;font-weight:700;padding:10px 16px;border-radius:6px;cursor:pointer}
.btn:hover{background:var(--red2)}
.btn.alt{background:#fff;color:var(--ink);border:1px solid #c7cbd2}
.btn.alt:hover{background:#f4f5f7}
.btn.del{background:#fff;color:var(--ko);border:1px solid var(--ko)}
.lcard{display:flex;align-items:center;gap:14px;padding:14px 16px;border:1px solid var(--line);border-left:5px solid var(--red);border-radius:8px;background:var(--card);margin-bottom:10px;cursor:pointer}
.lcard:hover{background:#fafafb}
.lcard .n{font-size:20px;font-weight:800;min-width:90px}
.lcard .m{color:var(--mut);font-size:13px;flex:1}
.bar{height:10px;background:#e1e3e7;border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--red)}
.pct{font-weight:800;min-width:48px;text-align:right}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:12px 0}
.stat{background:#fff;border:1px solid var(--line);border-top:4px solid var(--ok);border-radius:6px;padding:10px;text-align:center}
.stat b{display:block;font-size:26px;line-height:1.1}
.stat span{font-size:12px;color:var(--mut)}
.stat.o{border-top-color:var(--or)}.stat.b{border-top-color:var(--bl)}.stat.r{border-top-color:var(--ko)}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.grid{display:grid;grid-template-columns:34px 1.3fr 1fr 1fr 1fr 1.2fr;gap:8px;align-items:start;padding:8px;border-bottom:1px solid var(--line)}
.grid.h{background:var(--red);color:#fff;font-weight:700;font-size:13px;border-radius:6px 6px 0 0;align-items:center}
.grid:nth-child(even):not(.h){background:#f8f9fa}
.grid .num{padding-top:9px;color:var(--mut)}
.cell{display:grid;gap:6px}
.cell select.ok{background:var(--okb);color:var(--ok);font-weight:700}
.cell select.ko{background:var(--kob);color:var(--ko);font-weight:700}
.cell select.or{background:var(--orb);color:var(--or);font-weight:700}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid #c7cbd2;background:#fff;border-radius:99px;padding:5px 11px;font-size:13px;cursor:pointer}
.chip.on{background:var(--or);border-color:var(--or);color:#fff;font-weight:700}
.hist{max-height:260px;overflow:auto;font-size:13px}
.hist div{padding:6px 0;border-bottom:1px solid var(--line)}
.hist time{color:var(--mut);margin-right:8px}
.login{max-width:380px;margin:8vh auto;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.login .hd{background:var(--red);padding:18px;text-align:center}.login .hd img{height:52px}
.login .bd{padding:20px;display:grid;gap:14px}
.err{color:var(--ko);font-weight:600;font-size:14px}
.warn{background:var(--orb);border:1px solid var(--or);padding:10px 14px;border-radius:6px;margin-bottom:12px;font-size:14px}
.empty{text-align:center;color:var(--mut);padding:28px}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:6px;display:none;z-index:9}
.sheet{position:fixed;left:-99999px;top:0;width:900px;background:#fff;padding:26px;color:#1d1f24}
.sheet .sh{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:4px solid var(--red);padding-bottom:10px}
.sheet .sh img{height:52px}.sheet .sh small{display:block;text-align:right;color:var(--mut);letter-spacing:.08em}
.sheet .sh h1{margin:0;color:var(--red);font-size:34px;text-align:right}
.sheet .info{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:14px 0}
.sheet .info div{border:1px solid var(--line);border-radius:5px;padding:7px 10px;font-size:12px;color:var(--mut)}
.sheet .info b{display:block;font-size:16px;color:var(--ink)}
.sheet .stats{grid-template-columns:repeat(6,1fr)}
.sheet table{width:100%;border-collapse:collapse;font-size:13px;margin-top:12px}
.sheet th{background:var(--red);color:#fff;text-align:left;padding:7px 8px}
.sheet td{padding:6px 8px;border-bottom:1px solid #e6e8ec}
.sheet tr:nth-child(even) td{background:#f8f9fa}
.pill{display:inline-block;padding:1px 9px;border-radius:99px;font-weight:700;font-size:12px}
.pill.ok{background:var(--okb);color:var(--ok)}.pill.ko{background:var(--kob);color:var(--ko)}.pill.or{background:var(--orb);color:var(--or)}
.sheet footer{text-align:center;color:var(--mut);font-size:12px;border-top:1px solid var(--line);margin-top:10px;padding-top:8px}
.ro form[data-form="new"],.ro [data-act="del"]{display:none}
.ro .grid input:disabled,.ro .grid select:disabled{opacity:1;background:transparent;border-color:transparent;color:inherit;-webkit-text-fill-color:currentColor;appearance:none;-webkit-appearance:none}
.ro .chip:disabled{opacity:1;cursor:default}
@media(max-width:760px){
 main{padding:10px}
 .grid.h{display:none}
 .grid{grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:8px;margin-bottom:8px;background:#fff!important}
 .grid .num{grid-column:1/-1;font-weight:800;padding:0;color:var(--red)}
 .cell::before{content:attr(data-l);font-size:12px;color:var(--mut);font-weight:600}
 .cell.wide{grid-column:1/-1}
 .lcard{flex-wrap:wrap}.lcard .bar{flex-basis:100%;order:5}
}
@media print{
 @page{size:A4;margin:10mm}
 body{background:#fff}
 header.top,main,#toast{display:none!important}
 .sheet{position:static;width:auto;padding:0}
 *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
@media(prefers-reduced-motion:no-preference){.bar i{transition:width .4s}}
</style>
</head>
<body>
<div id="app"></div>
<div id="sheet" class="sheet"></div>
<div id="toast" role="status"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
/* ====== 1) DÉPÔT GITHUB qui contient index.html et data.json ====== */
const REPO = "mendestoss/suiviprodtrigano"; // compte/nom-du-dépôt
const BRANCH = "main";
const DEMO = false; // true = aperçu local sans GitHub
const CONFIGURED = true;
/* Comptes validés par l’administrateur */
const USERS = ["Jean Christophe Ménage","Johann Le Berre","Émilien Lecomte","Anthony Mendes","Brandon Dulompont"];

const MOTIFS = {manquant:"Manquant",reparation:"Réparation",reprise:"Reprise parc",qualite:"Qualité"};
const TYPES = {menuiserie:"Menuiserie",meuble:"Meuble"};
let S = {user:null,visitor:false,admin:false,token:"",etag:"",line:6,launches:[],cur:null,err:"",ready:true,busy:0};

const $ = s => document.querySelector(s);
const esc = s => String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const today = () => {const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`};
const fd = d => d ? d.split("-").reverse().join("/") : "—";
const fts = t => new Date(t).toLocaleString("fr-FR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});
function toast(m){const t=$("#toast");t.textContent=m;t.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display="none",2600)}

const rows = L => Object.keys(L.ch||{}).map(Number).sort((a,b)=>a-b).map(i=>({i,...L.ch[i]}));
function stats(L){
  const r = rows(L);
  const ok = r.filter(x=>x.s==="ok").length;
  return {ok, ko:r.filter(x=>x.s==="ko").length, com:r.filter(x=>x.q==="com").length,
    pc:r.filter(x=>x.q==="pc").length, fm:r.filter(x=>x.f==="avec").length,
    left:Math.max(0,L.qty-r.length), n:r.length, pct:L.qty?Math.round(ok/L.qty*100):0};
}
function qualTxt(x){return x.q==="com"?"Com":x.q==="pc"?"Pas com"+(x.m?" – "+MOTIFS[x.m]:""):"—"}
function fmTxt(x){return x.f==="sans"?"Sans":x.f==="avec"?"Avec"+((x.t||[]).length?" – "+x.t.map(k=>TYPES[k]).join(", "):""):"—"}

/* API PHP alwaysdata + MySQL CloudFive */
const API_BASE = "https://mendestoss.alwaysdata.net";
const API = API_BASE.replace(/\/$/,"");
const apiHeaders = () => ({"Content-Type":"application/json",...(S.token?{Authorization:"Bearer "+S.token}:{})});
async function api(path, options={}){
  const route = path.replace(/^\/api\//, "");
  const r=await fetch(API+"/api/index.php?route="+encodeURIComponent(route),{...options,headers:{...apiHeaders(),...(options.headers||{})},cache:"no-store"});
  if(!r.ok){const d=await r.json().catch(()=>({}));throw new Error(d.error||("HTTP "+r.status))}
  return r.json();
}
const hist=(L,o,a)=>{L.hist=(L.hist||[]).concat({t:o.t,u:o.u,a}).slice(-400)};
function applyOp(D,o){
  const L=D.find(l=>l.id===o.id);
  if(o.type==="create")D.unshift(o.launch);
  else if(o.type==="patch"&&L){L.ch[o.i]={...L.ch[o.i],...o.patch};hist(L,o,`${L.ch[o.i].c} : ${o.label}`)}
  else if(o.type==="log"&&L)hist(L,o,o.a);
  else if(o.type==="delete")return D.filter(l=>l.id!==o.id);
  return D;
}
async function pull(){
  const d=await api("/api/data");
  const next=JSON.stringify(d.launches||[]);
  if(next===JSON.stringify(S.launches))return false;
  S.launches=(d.launches||[]).sort((a,b)=>b.createdAt-a.createdAt);
  if(S.cur&&!S.launches.find(l=>l.id===S.cur))S.cur=null;
  return true;
}
let pend=[],flushing=false;
function send(o){
  if(S.visitor||!S.user)return;
  o.u=S.user;o.t=Date.now();
  pend.push(o);S.busy++;if(!flushing)flush();
}
async function flush(){
  flushing=true;
  while(pend.length){
    const ops=pend.splice(0);
    try{const d=await api("/api/ops",{method:"POST",body:JSON.stringify({ops})});S.launches=d.launches||[];toast("Enregistré et synchronisé")}
    catch(e){pend.unshift(...ops);S.err="Enregistrement impossible : "+e.message;toast(S.err);S.busy=Math.max(0,S.busy-ops.length);break}
    S.busy=Math.max(0,S.busy-ops.length);
    render();
  }
  flushing=false;
}
function logout(expired){sessionStorage.removeItem("trg_session");S.visitor=false;S.admin=false;S.user=null;S.token="";S.cur=null;S.launches=[];S.err=expired===true?"Session expirée, reconnecte-toi.":"";render()}
async function poll(){
  if((!S.user&&!S.visitor)||S.busy||document.hidden)return;
  if(pend.length){if(!flushing)flush();return;}
  const a=document.activeElement;if(a&&a.tagName==="INPUT"&&a.closest(".grid"))return;
  try{if(await pull())render()}catch(e){S.err="Synchronisation indisponible : "+e.message}
}
function start(){
  try{const x=JSON.parse(sessionStorage.getItem("trg_session")||"null");if(x){S.user=x.u;S.token=x.t;S.admin=!!x.admin}}catch(e){}
  if(S.user)api("/api/me").then(d=>{S.user=d.user;S.admin=d.admin;return pull()}).then(render).catch(e=>{logout(true)});
  render();setInterval(poll,5000);
}

function createLaunch(f){
  const num=f.num.value.trim(), qty=parseInt(f.qty.value,10), first=f.ch.value.trim().toUpperCase();
  const m=first.match(/^(.*?)(\d+)$/);
  if(!num||!qty||qty<1||!m){toast("Renseigne le lancement, la quantité et un châssis valide (ex. RMY67172)");return}
  const ch={}, w=m[2].length, base=parseInt(m[2],10), now=Date.now();
  for(let i=0;i<qty;i++) ch[i]={c:m[1]+String(base+i).padStart(w,"0"),d:"",s:"",q:"",m:"",f:"",t:[]};
  send({type:"create",launch:{id:"l"+now.toString(36)+Math.random().toString(36).slice(2,6),line:S.line,num,qty,ch,createdBy:S.user,createdAt:now,
    hist:[{t:now,u:S.user,a:`Lancement créé (${qty} châssis, ligne ${S.line})`}]}});
  toast("Lancement créé");
}
function upd(id,i,patch,label){send({type:"patch",id,i,patch,label})}
function delLaunch(id){
  const L=S.launches.find(l=>l.id===id); if(!L)return;
  S.cur=null;send({type:"delete",id,num:L.num});toast("Lancement supprimé");
}

/* ---------- Vues ---------- */
function render(){
  const a=$("#app");
  if(!CONFIGURED){a.innerHTML=head()+`<main><div class="warn"><b>Configuration de l’API manquante.</b> Vérifie l’adresse du service alwaysdata.</div></main>`;return}
  if(!S.ready){a.innerHTML="";return}
  if(!S.user&&!S.visitor){document.body.classList.remove("ro");a.innerHTML=loginView();return}
  const L=S.launches.find(l=>l.id===S.cur);
  a.innerHTML=head(true)+`<main>${DEMO?`<div class="warn">Mode aperçu : les données restent sur cet appareil et ne sont pas partagées. Connexion avec n’importe quel code.</div>`:""}${S.err?`<div class="warn">${esc(S.err)}</div>`:""}${S.admin?`<div class="actions"><button class="btn alt" data-act="admin">Administration des comptes</button></div>`:""}${S.adminView?adminView():L?detail(L):list()}</main>`;
  document.body.classList.toggle("ro",S.visitor);
  if(S.adminView)loadAdmin();
  if(S.visitor)document.querySelectorAll(".grid input,.grid select,.grid .chip").forEach(e=>e.disabled=true);
}
function head(auth){return `<header class="top"><img src="logo.png" alt="Trigano"><div><b style="font-size:17px">Suivi de lancements</b></div>${auth?`<div class="who"><b>${S.visitor?"Visiteur (lecture seule)":esc(S.user)}</b><button class="link" data-act="out">${S.visitor?"Se connecter":"Se déconnecter"}</button></div>`:""}</header>`}
function loginView(){return `<div class="login"><div class="hd"><img src="logo.png" alt="Trigano"></div><form class="bd" data-form="login">
<label class="f">Compte<select name="u">${USERS.map(u=>`<option>${esc(u)}</option>`).join("")}</select></label>
<label class="f">Code d’accès<input name="p" type="password" autocomplete="current-password" required></label>
<div class="err">${esc(S.err)}</div><button class="btn">Se connecter</button><button type="button" class="btn alt" data-act="visitor">Entrer en visiteur (lecture seule)</button></form></div>`}
function adminView(){return `<div class="panel"><h2>Administration — validation des comptes</h2><p>Attribue un code d’au moins 8 caractères et autorise chaque utilisateur. Les visiteurs sont en lecture seule.</p><div id="admin-users">Chargement des comptes…</div></div>`}
async function loadAdmin(){try{const d=await api("/api/admin/users");const a=$("#admin-users");if(!a)return;a.innerHTML=d.users.filter(u=>!u.admin).map(u=>`<form data-form="account" class="form" style="margin-bottom:12px;border-bottom:1px solid #ddd;padding-bottom:12px"><input type="hidden" name="user" value="${esc(u.name)}"><b>${esc(u.name)}${u.admin?" (Admin)":""}</b><label class="f">Nouveau code d’accès<input name="code" type="password" minlength="8" placeholder="8 caractères minimum, ou laisser vide"></label><label class="f">Autorisé<select name="enabled" ${u.admin?"disabled":""}><option value="true" ${u.enabled?"selected":""}>Oui</option><option value="false" ${!u.enabled?"selected":""}>Non</option></select></label><button class="btn" type="submit">Enregistrer</button></form>`).join("")}catch(e){toast(e.message)}}
function list(){
  const ls=S.launches.filter(l=>l.line===S.line);
  return `<div class="tabs">${[6,7].map(n=>`<button class="tab ${S.line===n?"on":""}" data-act="line" data-v="${n}">Ligne ${n}</button>`).join("")}</div>
<form class="panel" data-form="new"><h2>Nouveau lancement – ligne ${S.line}</h2><div class="form">
<label class="f">N° de lancement<input name="num" inputmode="numeric" placeholder="38303"></label>
<label class="f">Quantité à produire<input name="qty" type="number" min="1" max="200" placeholder="20"></label>
<label class="f">1er châssis<input name="ch" placeholder="RMY67172" style="text-transform:uppercase"></label>
<button class="btn">Créer le lancement</button></div></form>
${ls.length?ls.map(l=>{const s=stats(l);return `<div class="lcard" data-act="open" data-id="${l.id}"><div class="n">${esc(l.num)}</div>
<div class="m">${l.qty} châssis · ${esc(rows(l)[0]?.c||"")} → ${esc(rows(l).pop()?.c||"")}<br>${s.ok} validés · ${s.pc} pas com · ${s.fm} faux manquants</div>
<div class="pct">${s.pct} %</div><div class="bar"><i style="width:${s.pct}%"></i></div></div>`}).join(""):`<div class="empty">Aucun lancement sur la ligne ${S.line}. Crée le premier ci-dessus.</div>`}`;
}
function sel(opts,val,cls){return opts.map(([v,l])=>`<option value="${v}" ${val===v?"selected":""}>${l}</option>`).join("")}
function detail(L){
  const s=stats(L), id=L.id;
  const box=(n,l,c="")=>`<div class="stat ${c}"><b>${n}</b><span>${l}</span></div>`;
  return `<div class="actions"><button class="btn alt" data-act="back">← Lancements</button></div>
<div class="panel"><h2>Ligne ${L.line} · Lancement ${esc(L.num)} · ${L.qty} à produire</h2>
<div class="stats">${box(s.ok,"Sorties validées")}${box(s.ko,"Non validées","r")}${box(s.com,"Com")}${box(s.pc,"Pas com","r")}${box(s.fm,"Faux manquants","o")}${box(s.left,"Restants à saisir","b")}</div>
<div class="bar"><i style="width:${s.pct}%"></i></div><div style="font-size:13px;color:var(--mut);margin-top:4px">Avancement des sorties de ligne : ${s.pct} %</div>
<div class="actions"><button class="btn" data-act="print" data-id="${id}">Imprimer / PDF</button>
<button class="btn alt" data-act="img" data-id="${id}">Image / Partager</button>
<button class="btn alt" data-act="mail" data-id="${id}">E-mail</button>
<button class="btn ${S.delArm===id?"":"del"}" data-act="del" data-id="${id}" style="margin-left:auto">${S.delArm===id?"Confirmer la suppression ?":"Supprimer"}</button></div></div>
<div class="panel" style="padding:0;overflow:hidden"><div class="grid h"><div>N°</div><div>Châssis</div><div>Date</div><div>Sortie de ligne</div><div>Qualité</div><div>Faux manquant</div></div>
${rows(L).map(x=>`<div class="grid" data-id="${id}" data-i="${x.i}"><div class="num">${x.i+1}</div>
<div class="cell" data-l="Châssis"><input data-f="c" value="${esc(x.c)}" style="font-weight:700"></div>
<div class="cell" data-l="Date"><input type="date" data-f="d" value="${x.d}"></div>
<div class="cell" data-l="Sortie de ligne"><select data-f="s" class="${x.s==="ok"?"ok":x.s==="ko"?"ko":""}">${sel([["","—"],["ok","Validée"],["ko","Non validée"]],x.s)}</select></div>
<div class="cell" data-l="Qualité"><select data-f="q" class="${x.q==="com"?"ok":x.q==="pc"?"ko":""}">${sel([["","—"],["com","Com"],["pc","Pas com"]],x.q)}</select>
${x.q==="pc"?`<select data-f="m" class="or">${sel([["","Motif…"],...Object.entries(MOTIFS)],x.m)}</select>`:""}</div>
<div class="cell wide" data-l="Faux manquant"><select data-f="f" class="${x.f==="sans"?"ok":x.f==="avec"?"or":""}">${sel([["","—"],["sans","Sans"],["avec","Avec"]],x.f)}</select>
${x.f==="avec"?`<div class="chips">${Object.entries(TYPES).map(([k,l])=>`<button type="button" class="chip ${(x.t||[]).includes(k)?"on":""}" data-act="chip" data-k="${k}">${l}</button>`).join("")}</div>`:""}</div></div>`).join("")}</div>
<div class="panel"><h2>Historique du lancement</h2><div class="hist">${[...(L.hist||[])].reverse().map(h=>`<div><time>${fts(h.t)}</time><b>${esc(h.u)}</b> – ${esc(h.a)}</div>`).join("")}</div></div>`;
}

/* ---------- Feuille imprimable / image ---------- */
function sheetHTML(L){
  const s=stats(L), now=new Date();
  const info=(l,v)=>`<div>${l}<b>${esc(v)}</b></div>`, box=(n,l)=>`<div class="stat"><b>${n}</b><span>${l}</span></div>`;
  return `<div class="sh"><img src="logo.png" alt="Trigano"><div><small>FEUILLE DE SUIVI DE LIGNE</small><h1>Ligne ${L.line}</h1></div></div>
<div class="info">${info("LANCEMENT",L.num)}${info("QUANTITÉ À PRODUIRE",L.qty)}${info("CHÂSSIS SAISIS",s.n)}${info("ÉDITÉ LE",now.toLocaleDateString("fr-FR"))}${info("ÉDITÉ PAR",S.visitor?"Visiteur":S.user)}</div>
<div class="stats">${box(s.ok,"Sorties validées")}${box(s.ko,"Non validées")}${box(s.com,"Com")}${box(s.pc,"Pas com")}${box(s.fm,"Faux manquants")}${box(s.left,"Restants à saisir")}</div>
<div class="bar" style="margin-top:10px"><i style="width:${s.pct}%"></i></div><div style="font-size:12px;color:var(--mut);margin-top:4px">Avancement des sorties de ligne : ${s.pct} %</div>
<table><tr><th>N°</th><th>Châssis</th><th>Date</th><th>Sortie de ligne</th><th>Qualité</th><th>Faux manquant</th></tr>
${rows(L).map(x=>`<tr><td>${x.i+1}</td><td><b>${esc(x.c)}</b></td><td>${fd(x.d)}</td>
<td>${x.s?`<span class="pill ${x.s==="ok"?"ok":"ko"}">${x.s==="ok"?"Validée":"Non validée"}</span>`:"—"}</td>
<td>${x.q?`<span class="pill ${x.q==="com"?"ok":"ko"}">${esc(qualTxt(x))}</span>`:"—"}</td>
<td>${x.f?`<span class="pill ${x.f==="sans"?"ok":"or"}">${esc(fmTxt(x))}</span>`:"—"}</td></tr>`).join("")}</table>
<footer>Trigano – Suivi de ligne – Lancement ${esc(L.num)} – Document généré le ${now.toLocaleString("fr-FR")} par ${esc(S.visitor?"Visiteur":S.user)}</footer>`;
}
function prep(id){const L=S.launches.find(l=>l.id===id);$("#sheet").innerHTML=sheetHTML(L);return L}
const logAct=(id,a)=>send({type:"log",id,a});

/* ---------- Événements ---------- */
document.addEventListener("click",async e=>{
  const b=e.target.closest("[data-act]"); if(!b)return;
  const act=b.dataset.act, id=b.dataset.id;
  if(act==="line"){S.line=+b.dataset.v;render()}
  else if(act==="admin"&&S.admin){S.adminView=!S.adminView;S.cur=null;render()}
   else if(act==="visitor"){S.visitor=true;S.err="";try{await pull()}catch(e){S.err="Connexion impossible à CloudFive : "+e.message;S.visitor=false}render()}
  else if(act==="open"){S.cur=id;render();scrollTo(0,0)}
  else if(act==="back"){S.cur=null;render()}
  else if(act==="out"){logout()}
  else if(act==="del"){if(S.visitor)return;if(S.delArm!==id){S.delArm=id;render();setTimeout(()=>{if(S.delArm===id){S.delArm=null;render()}},4000)}else{S.delArm=null;delLaunch(id)}}
  else if(act==="chip"){if(S.visitor)return;
    const g=b.closest(".grid"), L=S.launches.find(l=>l.id===g.dataset.id), x=L.ch[g.dataset.i], k=b.dataset.k;
    const t=(x.t||[]).includes(k)?x.t.filter(v=>v!==k):[...(x.t||[]),k];
    upd(g.dataset.id,g.dataset.i,{t},`faux manquant ${t.length?t.map(v=>TYPES[v]).join(", "):"sans type"}`);
  }
  else if(act==="print"){const L=prep(id);const o=document.title;document.title=`Suivi ligne ${L.line} - lancement ${L.num}`;logAct(id,"Impression");setTimeout(()=>{print();document.title=o},150)}
  else if(act==="img"){
    const L=prep(id); toast("Création de l’image…");
    const c=await html2canvas($("#sheet"),{scale:2,backgroundColor:"#fff"});
    c.toBlob(async blob=>{
      const f=new File([blob],`Suivi-ligne${L.line}-lancement${L.num}.png`,{type:"image/png"});
      logAct(id,"Image enregistrée / partagée");
      if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:`Suivi lancement ${L.num}`});return}catch(_){return}}
      const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=f.name;a.click();toast("Image téléchargée");
    });
  }
  else if(act==="mail"){
    const L=S.launches.find(l=>l.id===id), s=stats(L);
    const body=`Suivi ligne ${L.line} – lancement ${L.num}\nAvancement : ${s.pct} % (${s.ok}/${L.qty} sorties validées)\nCom : ${s.com} | Pas com : ${s.pc} | Faux manquants : ${s.fm}\n\n`+
      rows(L).map(x=>`${x.c} | ${fd(x.d)} | ${x.s==="ok"?"Validée":x.s==="ko"?"Non validée":"—"} | ${qualTxt(x)} | ${fmTxt(x)}`).join("\n")+`\n\nÉdité par ${S.visitor?"Visiteur":S.user} le ${new Date().toLocaleString("fr-FR")}`;
    logAct(id,"Envoi par e-mail");
    location.href=`mailto:?subject=${encodeURIComponent(`Trigano – Suivi ligne ${L.line} – lancement ${L.num}`)}&body=${encodeURIComponent(body)}`;
  }
});
document.addEventListener("change",e=>{
  const el=e.target, g=el.closest(".grid"); if(S.visitor||!g||!el.dataset.f)return;
  const f=el.dataset.f, v=el.value, id=g.dataset.id, i=g.dataset.i, L=S.launches.find(l=>l.id===id), x=L.ch[i];
  const patch={[f]:v};
  if(f==="s"&&v==="ok"&&!x.d)patch.d=today();
  if(f==="q"&&v!=="pc")patch.m="";
  if(f==="f"&&v!=="avec")patch.t=[];
  const lab={c:`châssis renommé en ${v}`,d:`date ${fd(v)}`,s:`sortie ${v==="ok"?"validée":v==="ko"?"non validée":"effacée"}`,
    q:`qualité ${v==="com"?"Com":v==="pc"?"Pas com":"effacée"}`,m:`motif ${MOTIFS[v]||"effacé"}`,f:`faux manquant ${v==="avec"?"avec":v==="sans"?"sans":"effacé"}`}[f];
  upd(id,i,patch,lab);
});
document.addEventListener("submit",async e=>{
  const f=e.target; if(!f.dataset.form)return; e.preventDefault();
  if(f.dataset.form==="new"&&!S.visitor)createLaunch(f);
   if(f.dataset.form==="account"&&S.admin){try{await api("/api/admin/users",{method:"POST",body:JSON.stringify({user:f.elements.user.value,code:f.elements.code.value,enabled:f.elements.enabled.value!=="false"})});toast("Compte mis à jour");loadAdmin()}catch(e){toast("Erreur : "+e.message)}return}
  if(f.dataset.form==="login"){
    S.err="";const u=f.u.value,t=f.p.value.trim();
    try{
      const d=await api("/api/login",{method:"POST",body:JSON.stringify({user:u,code:t})});
      S.user=d.user;S.token=d.token;S.admin=!!d.admin;S.visitor=false;
      sessionStorage.setItem("trg_session",JSON.stringify({u:S.user,t:S.token,admin:S.admin}));
      await pull();render();
    }catch(e){S.user=null;S.admin=false;S.token="";sessionStorage.removeItem("trg_session");S.err="Connexion refusée : "+e.message;render()}

  }
});
start();
</script>
</body>
</html>
